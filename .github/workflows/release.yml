name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog: ${{ steps.check.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' version.json)
          CHANGELOG=$(jq -r '.changelog' version.json)
          LATEST=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "none")

          echo "Current version: $VERSION"
          echo "Latest release: $LATEST"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "release-$VERSION" != "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
            echo "New version detected: release-$VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No new version detected"
          fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri binary
        run: npx tauri build --no-bundle

      - name: Prepare unpacked folder
        run: |
          mkdir release\win-unpacked
          copy src-tauri\target\release\openlauncher.exe release\win-unpacked\OpenLauncher.exe

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS installer with custom script
        run: |
          cd script
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          cd ..

      - name: Build portable version
        run: |
          copy src-tauri\target\release\openlauncher.exe release\OpenLauncher-Portable-Windows.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundles (deb & appimage)
        run: npx tauri build --bundles deb,appimage

      - name: Package artifacts
        run: |
          mkdir -p release
          # Copy .deb
          cp src-tauri/target/release/bundle/deb/*.deb release/OpenLauncher.deb || true
          # Copy .AppImage
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/OpenLauncher.AppImage || true
          # Create portable tar.gz
          tar -czvf release/OpenLauncher.tar.gz -C src-tauri/target/release openlauncher

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.deb
            release/*.tar.gz
            release/*.AppImage

  build-macos:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundle (dmg)
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Package macOS artifacts
        run: |
          mkdir -p release
          # Copy dmg
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release/OpenLauncher-mac-${{ matrix.arch }}.dmg || true
          # Create zip of .app
          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/OpenLauncher.app" ]; then
            cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
            zip -r "../../../../../release/OpenLauncher-mac-${{ matrix.arch }}.zip" OpenLauncher.app
            cd -
          fi

      - name: Upload macOS artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build
          path: |
            release/*.dmg
            release/*.zip

  create-release:
    needs: [check-version, build-windows, build-linux, build-macos]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./release/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*-build
          path: ./release/macos
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ needs.check-version.outputs.version }}
          name: release-${{ needs.check-version.outputs.version }}
          body: ${{ needs.check-version.outputs.changelog }}
          files: |
            release/windows/*
            release/linux/*
            release/macos/*
          draft: false
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
