[package]
name = "openlauncher"
version = "1.2.0"
description = "OpenLauncher is an open source Minecraft launcher"
authors = ["CesarGarza55"]
license = "GPL-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
dirs = "5.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
open = "5.3"
urlencoding = "2.1"
log = "0.4"
tauri-plugin-window-state = "2"
